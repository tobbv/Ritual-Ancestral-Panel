<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--ink:#1d1d1f;--muted:#6e6e73;--soft:#8e8e93;--line:rgba(60,60,67,.13);--bg:#f5f5f7;--card:rgba(255,255,255,.94);--olive:#444417;--gold:#b67a35;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--radius:22px;--shadow:0 10px 36px rgba(0,0,0,.07)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:linear-gradient(180deg,#f9f9fb 0,#f5f5f7 330px);font:15px -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}.shell{max-width:860px;margin:auto;padding:0 18px 60px}.nav{position:sticky;top:0;z-index:20;margin:0 -18px;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;background:rgba(249,249,251,.78);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--line)}.nav-inner{max-width:824px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#606020,#35350e);color:#f2d7a6;font-size:17px;font-weight:800;box-shadow:inset 0 0 0 1px #fff2}.brand-text{min-width:0}.brand-text strong{display:block;font-size:16px;letter-spacing:-.25px}.brand-text span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.icon-btn{width:38px;height:38px;border:0;border-radius:50%;background:#e9e9ed;color:var(--ink);font-size:18px;cursor:pointer}
.hero{padding:26px 2px 17px}.eyebrow{font-size:12px;color:var(--muted);font-weight:650;margin-bottom:5px}.hero-line{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.hero h1{font-size:34px;line-height:1.04;letter-spacing:-1.25px;margin:0;font-weight:760}.progress-ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) var(--progress,0%),#e4e4e7 0);position:relative;flex:0 0 auto}.progress-ring:after{content:"";position:absolute;inset:5px;border-radius:50%;background:#f8f8fa}.progress-ring span{position:relative;z-index:1;font-size:12px;font-weight:750}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.summary-item{background:rgba(255,255,255,.75);border:1px solid #fff;border-radius:16px;padding:12px 13px;box-shadow:0 3px 14px #00000008}.summary-item b{display:block;font-size:19px;letter-spacing:-.4px}.summary-item small{color:var(--muted);font-size:11px;font-weight:600}.summary-item.money b{color:var(--orange)}
.route-alert{display:none;align-items:center;justify-content:space-between;gap:12px;background:#fff5e6;border:1px solid #ffe0ad;color:#8a5000;border-radius:16px;padding:12px 14px;margin:2px 0 14px;font-size:13px}.route-alert.show{display:flex}.route-alert button{border:0;background:transparent;color:var(--blue);font-weight:700;cursor:pointer}.next-route{width:100%;border:0;border-radius:17px;padding:14px 16px;background:var(--blue);color:white;font-weight:700;font-size:15px;display:flex;justify-content:center;align-items:center;gap:8px;box-shadow:0 7px 18px rgba(0,122,255,.22);cursor:pointer;margin-bottom:15px}.next-route:disabled{background:#c7c7cc;box-shadow:none}.segmented{display:grid;grid-template-columns:repeat(3,1fr);background:#e9e9ed;border-radius:12px;padding:3px;margin-bottom:15px}.segmented button{border:0;background:transparent;border-radius:9px;padding:8px;color:#555;font-weight:650;cursor:pointer}.segmented button.active{background:#fff;color:var(--ink);box-shadow:0 1px 5px #0002}.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}.section-title h2{font-size:20px;letter-spacing:-.45px;margin:0}.section-title span{font-size:12px;color:var(--muted)}
.stop-card{position:relative;background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);padding:17px;margin-bottom:13px;box-shadow:var(--shadow);overflow:hidden}.stop-card.next{box-shadow:0 12px 38px rgba(0,122,255,.13);border-color:rgba(0,122,255,.25)}.stop-card.done{opacity:.72}.stop-head{display:grid;grid-template-columns:43px 1fr auto;gap:11px;align-items:start}.stop-no{width:43px;height:43px;border-radius:14px;background:#ededf1;color:var(--muted);display:grid;place-items:center;font-size:17px;font-weight:750}.next .stop-no{background:var(--blue);color:#fff}.customer{min-width:0}.customer h3{font-size:19px;letter-spacing:-.35px;margin:0 0 3px}.customer p{margin:0;color:var(--muted);font-size:13px}.status{padding:5px 9px;border-radius:999px;background:#fff1d8;color:#b45d00;font-size:11px;font-weight:750;white-space:nowrap}.status.camino{background:#e8f2ff;color:#0067d8}.status.entregado{background:#e8f8ec;color:#188038}.order-controls{display:flex;gap:5px;margin:12px 0 0 54px}.order-controls button{border:0;background:#f0f0f3;color:var(--muted);border-radius:9px;padding:5px 10px;font-size:12px;font-weight:650;cursor:pointer}.info-block{margin-top:13px;padding:13px 14px;border-radius:15px;background:#f6f6f8}.info-label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.55px;font-weight:700;margin-bottom:4px}.products{font-weight:650;line-height:1.35}.note{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);color:#444;line-height:1.35}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.fact{border:1px solid var(--line);border-radius:13px;padding:10px 11px;min-width:0}.fact span{display:block;color:var(--muted);font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.4px}.fact b{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fact.collect{background:#fff5e7;border-color:#ffe1b4}.fact.collect b{color:#c15e00}.fact.paid{background:#eef8f0;border-color:#d3efd9}.fact.paid b{color:#238636}
.primary-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{border:0;border-radius:14px;min-height:46px;padding:10px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}.maps{background:var(--blue);color:#fff}.maps.missing{background:#ececf0;color:var(--muted)}.wa{background:#e9f8ed;color:#16883a}.secondary-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.secondary-actions .action{background:#f0f0f3;color:#444;font-size:12px;min-height:40px}.secondary-actions .delivered{background:#e8f8ec;color:#188038}.secondary-actions .onway{background:#e8f2ff;color:#0067d8}.fields{display:none;gap:9px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}.fields.open{display:grid}input,textarea{width:100%;border:1px solid #d1d1d6;border-radius:12px;padding:11px 12px;background:#fff;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.12)}.save{background:var(--olive)!important;color:#fff!important}.empty{text-align:center;padding:60px 18px;color:var(--muted)}.empty-icon{font-size:38px;margin-bottom:8px}.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(30,30,32,.92);color:#fff;padding:11px 16px;border-radius:999px;font-weight:650;opacity:0;pointer-events:none;transition:.22s;z-index:50;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){.shell{padding-left:13px;padding-right:13px}.nav{margin-left:-13px;margin-right:-13px}.hero h1{font-size:30px}.summary-item{padding:10px}.summary-item b{font-size:17px}.stop-card{padding:14px;border-radius:20px}.stop-head{grid-template-columns:39px 1fr}.stop-no{width:39px;height:39px}.status{grid-column:2;justify-self:start}.order-controls{margin-left:50px}.facts{grid-template-columns:1fr}.secondary-actions{grid-template-columns:1fr 1fr}.secondary-actions .action:last-child{grid-column:1/-1}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body>
<div class="shell"><header class="nav"><div class="nav-inner"><div class="brand"><div class="brand-mark">RA</div><div class="brand-text"><strong>Ritual Ancestral</strong><span id="who">Portal privado de entregas</span></div></div><button class="icon-btn" onclick="cargar()" aria-label="Actualizar">↻</button></div></header>
<section class="hero"><div class="eyebrow" id="todayLabel"></div><div class="hero-line"><h1>Tu recorrido</h1><div class="progress-ring" id="progressRing"><span id="progressText">0%</span></div></div><div class="summary"><div class="summary-item"><b id="sumPending">0</b><small>Por entregar</small></div><div class="summary-item"><b id="sumDone">0</b><small>Entregadas</small></div><div class="summary-item money"><b id="sumCollect">Gs 0</b><small>Por cobrar</small></div></div></section>
<div class="route-alert" id="locationAlert"><span id="locationAlertText"></span><button onclick="filtrarSinUbicacion()">Revisar</button></div>
<button class="next-route" id="nextRouteBtn" onclick="abrirSiguiente()">↗ Abrir próxima parada en Google Maps</button>
<nav class="segmented" aria-label="Filtro de entregas"><button id="filterHoy" class="active" onclick="filtrar('hoy')">Hoy</button><button id="filterPendientes" onclick="filtrar('pendientes')">Pendientes</button><button id="filterTodas" onclick="filtrar('todas')">Todas</button></nav>
<div class="section-title"><h2 id="listTitle">Ruta de hoy</h2><span id="routeCount"></span></div><main id="list"><div class="empty"><div class="empty-icon">⌛</div>Cargando entregas…</div></main></div><div class="toast" id="toast"></div>
<script>
const SB_URL='https://nadxjmlbtvrdvigqynzx.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXAiLCJyZWYiOiJuYWR4am1sYnR2cmR2aWdxeW56eCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzgyMzk3MzI4LCJleHAiOjIwOTc5NzMzMjh9.wEmd5Q0XjlCpO2SKd-GwBAO46fS1tGFFKg1ue8-LXAo';
const MENSAJE_WHATSAPP=encodeURIComponent('Hola, soy el delivery de Ritual Ancestral. Estoy en camino con tu pedido 😊');
const sb=supabase.createClient(SB_URL,SB_KEY),token=new URLSearchParams(location.search).get('token');let rows=[],filtro='hoy',soloSinUbicacion=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);const gs=n=>'Gs '+(parseInt(n)||0).toLocaleString('es-PY');
const orderKey=()=>`ritual_delivery_order_${token||'none'}`;const ordenGuardado=()=>{try{return JSON.parse(localStorage.getItem(orderKey())||'[]')}catch(e){return[]}};
function fechaBonita(v){if(!v)return'Sin fecha';const d=new Date(v+'T12:00:00');return d.toLocaleDateString('es-PY',{weekday:'short',day:'numeric',month:'short'})}
function telefonoLink(v){let n=String(v||'').replace(/\D/g,'');if(n.startsWith('0'))n='595'+n.slice(1);else if(n.startsWith('9'))n='595'+n;return n}
function mapaLink(v){try{const u=new URL(String(v||''));return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return''}}
function estadoClase(v){v=String(v||'').toLowerCase();return v.includes('entregado')?'entregado':v.includes('camino')?'camino':''}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>e.classList.remove('show'),2600)}
function ordenar(arr){const saved=ordenGuardado();return [...arr].sort((a,b)=>{const ia=saved.indexOf(String(a.id)),ib=saved.indexOf(String(b.id));if(ia>=0||ib>=0)return(ia<0?9999:ia)-(ib<0?9999:ib);return String(a.ciudad||'').localeCompare(String(b.ciudad||''))||String(a.cliente||'').localeCompare(String(b.cliente||''))})}
function guardarOrden(list){localStorage.setItem(orderKey(),JSON.stringify(list.map(x=>String(x.id))))}
async function cargar(){if(!token){document.querySelector('#list').innerHTML='<div class="empty"><div class="empty-icon">🔒</div>Este enlace no contiene un acceso válido.</div>';document.querySelector('#nextRouteBtn').disabled=true;return}document.querySelector('#list').innerHTML='<div class="empty"><div class="empty-icon">⌛</div>Actualizando ruta…</div>';const{data,error}=await sb.rpc('delivery_listar',{p_token:token});if(error){document.querySelector('#list').innerHTML='<div class="empty"><div class="empty-icon">🔒</div>Enlace inválido o vencido.<br><small>Pedí un enlace nuevo a Ritual Ancestral.</small></div>';document.querySelector('#nextRouteBtn').disabled=true;return}rows=ordenar((data||[]).map(r=>({...r,ubicacion:mapaLink(r.ubicacion)})));if(rows[0])document.querySelector('#who').textContent=rows[0].delivery_persona;render()}
function vista(){let list=rows;if(filtro==='hoy')list=list.filter(x=>(x.dia_entrega||x.fecha)===hoy());if(filtro==='pendientes')list=list.filter(x=>!['Entregado','Cancelado'].includes(x.estado_entrega));if(soloSinUbicacion)list=list.filter(x=>!x.ubicacion);return list}
function filtrar(f){filtro=f;soloSinUbicacion=false;['Hoy','Pendientes','Todas'].forEach(x=>document.querySelector('#filter'+x).classList.toggle('active',x.toLowerCase()===f));render()}
function filtrarSinUbicacion(){soloSinUbicacion=true;filtro='todas';document.querySelectorAll('.segmented button').forEach(x=>x.classList.remove('active'));render()}
function mover(id,delta){const list=vista(),i=list.findIndex(x=>String(x.id)===String(id)),j=i+delta;if(i<0||j<0||j>=list.length)return;const a=list[i],b=list[j],ia=rows.indexOf(a),ib=rows.indexOf(b);[rows[ia],rows[ib]]=[rows[ib],rows[ia]];guardarOrden(rows);render();toast('Orden de ruta guardado')}
function resumen(){const pendientes=rows.filter(x=>!['Entregado','Cancelado'].includes(x.estado_entrega)),done=rows.filter(x=>x.estado_entrega==='Entregado'),cobrar=pendientes.filter(x=>String(x.estado_pago).toLowerCase()!=='pagado').reduce((s,x)=>s+(+x.total_productos||0)+(+x.costo_delivery||0),0),pct=rows.length?Math.round(done.length*100/rows.length):0;document.querySelector('#sumPending').textContent=pendientes.length;document.querySelector('#sumDone').textContent=done.length;document.querySelector('#sumCollect').textContent=gs(cobrar);document.querySelector('#progressRing').style.setProperty('--progress',pct+'%');document.querySelector('#progressText').textContent=pct+'%';const faltan=pendientes.filter(x=>!x.ubicacion).length;document.querySelector('#locationAlert').classList.toggle('show',faltan>0);document.querySelector('#locationAlertText').textContent=faltan+' entrega'+(faltan===1?'':'s')+' sin ubicación registrada.';const siguiente=pendientes.find(x=>x.ubicacion);document.querySelector('#nextRouteBtn').disabled=!siguiente}
function render(){resumen();const list=vista(),pending=list.filter(x=>x.estado_entrega!=='Entregado'),nextId=pending[0]?.id;document.querySelector('#todayLabel').textContent=new Date().toLocaleDateString('es-PY',{weekday:'long',day:'numeric',month:'long'});document.querySelector('#listTitle').textContent=soloSinUbicacion?'Ubicaciones pendientes':filtro==='hoy'?'Ruta de hoy':filtro==='pendientes'?'Entregas pendientes':'Todas las entregas';document.querySelector('#routeCount').textContent=list.length+' parada'+(list.length===1?'':'s');const el=document.querySelector('#list');if(!list.length){el.innerHTML='<div class="empty"><div class="empty-icon">✓</div>No hay entregas en esta vista.</div>';return}el.innerHTML=list.map((r,i)=>card(r,i+1,String(r.id)===String(nextId))).join('')}
function card(r,n,isNext){const paid=String(r.estado_pago||'').toLowerCase()==='pagado',total=(+r.total_productos||0)+(+r.costo_delivery||0),done=r.estado_entrega==='Entregado',tel=telefonoLink(r.contacto),st=estadoClase(r.estado_entrega);return`<article class="stop-card ${isNext?'next':''} ${done?'done':''}" id="stop-${esc(r.id)}"><div class="stop-head"><div class="stop-no">${done?'✓':n}</div><div class="customer"><h3>${esc(r.cliente)}</h3><p>${esc(r.ciudad||'Sin ciudad')} · ${esc(r.contacto||'Sin teléfono')}</p></div><span class="status ${st}">${esc(r.estado_entrega||'Asignado')}</span></div><div class="order-controls"><button onclick="mover('${esc(r.id)}',-1)">↑ Antes</button><button onclick="mover('${esc(r.id)}',1)">↓ Después</button></div><div class="info-block"><span class="info-label">Pedido</span><div class="products">${esc(r.detalle||'Sin detalle')}</div>${r.observaciones?`<div class="note"><span class="info-label">Indicaciones</span>${esc(r.observaciones)}</div>`:''}${r.delivery_observacion?`<div class="note"><span class="info-label">Nota del recorrido</span>${esc(r.delivery_observacion)}</div>`:''}</div><div class="facts"><div class="fact ${paid?'paid':'collect'}"><span>${paid?'Pago':'Cobrar al entregar'}</span><b>${paid?'✓ No cobrar':gs(total)}</b></div><div class="fact"><span>Fecha</span><b>${esc(fechaBonita(r.dia_entrega||r.fecha))}</b></div></div><div class="primary-actions">${r.ubicacion?`<a class="action maps" href="${esc(r.ubicacion)}" target="_blank" rel="noopener">↗ Google Maps</a>`:`<button class="action maps missing" onclick="toast('Este pedido no tiene ubicación')">⌖ Sin ubicación</button>`}${tel?`<a class="action wa" href="https://wa.me/${tel}?text=${MENSAJE_WHATSAPP}" target="_blank" rel="noopener">WhatsApp</a>`:`<button class="action wa" disabled>Sin WhatsApp</button>`}</div><div class="secondary-actions">${tel?`<a class="action" href="tel:+${tel}">Llamar</a>`:''}<button class="action onway" onclick="actualizar('${esc(r.id)}','En camino')">En camino</button><button class="action delivered" onclick="actualizar('${esc(r.id)}','Entregado')">Entregado</button><button class="action" onclick="toggleNota('${esc(r.id)}')">Nota / reprogramar</button></div><div class="fields" id="nota-${esc(r.id)}"><textarea id="obs-${esc(r.id)}" rows="3" maxlength="1000" placeholder="Ej: cliente pidió que se entregue mañana">${esc(r.delivery_observacion||'')}</textarea><label>Reprogramar para</label><input id="fecha-${esc(r.id)}" type="date"><button class="action save" onclick="guardarNota('${esc(r.id)}')">Guardar cambios</button></div></article>`}
function toggleNota(id){document.getElementById('nota-'+id).classList.toggle('open')}
function abrirSiguiente(){const r=rows.find(x=>!['Entregado','Cancelado'].includes(x.estado_entrega)&&mapaLink(x.ubicacion));if(r)window.open(mapaLink(r.ubicacion),'_blank','noopener')}
async function actualizar(id,estado,obs='',fecha=null){if(estado==='Entregado'&&!confirm('¿Confirmás que el pedido fue entregado?'))return;const{error}=await sb.rpc('delivery_actualizar',{p_token:token,p_venta_id:id,p_estado:estado,p_observacion:obs,p_nueva_fecha:fecha||null});if(error){toast(error.message);return}toast(estado==='Entregado'?'Entrega completada':'Estado actualizado');await cargar()}
async function guardarNota(id){const obs=document.getElementById('obs-'+id).value.trim(),fecha=document.getElementById('fecha-'+id).value;if(!obs&&!fecha){toast('Escribí una nota o elegí una fecha');return}await actualizar(id,fecha?'Reprogramado':'Asignado',obs,fecha||null)}
cargar();
</script></body></html>
