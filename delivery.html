}
try{const saved=JSON.parse(localStorage.getItem('ritual_login_brand_v1_'+new URL(SB_URL).host)||'null');const appearance=JSON.parse(saved?.apariencia||'{}');aplicarColorDelivery(appearance.primary||appearance.brand?.primary)}catch(e){}

function mapaLink(v){try{const u=new URL(String(v||''));return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return''}}

function ordenar(arr){const saved=ordenGuardado();return [...arr].sort((a,b)=>{const ia=saved.indexOf(String(a.id)),ib=saved.indexOf(String(b.id));if(ia>=0||ib>=0)return(ia<0?9999:ia)-(ib<0?9999:ib);return String(a.ciudad||'').localeCompare(String(b.ciudad||''))||String(a.cliente||'').localeCompare(String(b.cliente||''))})}

async function cargar(){if(!token){document.querySelector('#list').innerHTML='<div class="empty"><div class="empty-icon">🔒</div>Este enlace no contiene un acceso válido.</div>';document.querySelector('#nextRouteBtn').disabled=true;return}document.querySelector('#list').innerHTML='<div class="empty"><div class="empty-icon">⌛</div>Actualizando ruta…</div>';const{data,error}=await sb.rpc('delivery_listar',{p_token:token});if(error){document.querySelector('#list').innerHTML='<div class="empty"><div class="empty-icon">🔒</div>Enlace inválido o vencido.<br><small>Pedí un enlace nuevo a Ritual Ancestral.</small></div>';document.querySelector('#nextRouteBtn').disabled=true;return}rows=ordenar((data||[]).map(r=>({...r,ubicacion:mapaLink(r.ubicacion)})));if(rows[0])document.querySelector('#who').textContent=rows[0].delivery_persona;render();cargarPerfil().catch(()=>{})}

function toggleOrder(id){openOrderId=String(openOrderId)===String(id)?null:String(id);render();document.getElementById('stop-'+id)?.querySelector('.stop-toggle')?.focus({preventScroll:true})}
function pedidoLabel(id){const value=String(id||'').trim();return value.startsWith('#')?value:'#'+value}

function card(r,n,isNext){const id=esc(r.id),paid=String(r.estado_pago||'').toLowerCase()==='pagado',total=(+r.total_productos||0)+(+r.costo_delivery||0),done=r.estado_entrega==='Entregado',tel=telefonoLink(r.contacto),expanded=String(openOrderId)===String(r.id),amount=paid?'No cobrar':gs(total),maps=r.ubicacion?`<a class="action maps" href="${esc(r.ubicacion)}" target="_blank" rel="noopener">${icon('route')} Cómo llegar</a>`:`<button class="action maps missing" onclick="toast('Este pedido no tiene ubicación')">⌖ Sin ubicación</button>`,wa=tel?`<a class="action wa" href="https://wa.me/${tel}?text=${MENSAJE_WHATSAPP}" target="_blank" rel="noopener"><svg aria-hidden="true" viewBox="0 0 32 32" width="21" height="21" fill="currentColor"><path d="M16 2.7A13.1 13.1 0 0 0 4.65 22.3L2.7 29.3l7.2-1.88A13.3 13.3 0 1 0 16 2.7Zm0 2.5a10.8 10.8 0 1 1-5.3 20.2l-.5-.3-3.8 1 1-3.7-.3-.5A10.8 10.8 0 0 1 16 5.2Zm-5.2 5.1c-.4 0-.9.2-1.2.6-.3.4-1.1 1.1-1.1 2.7s1.2 3.1 1.4 3.3c.2.2 2.3 3.7 5.7 5 .8.3 1.5.5 2 .6.8.1 1.5.1 2-.1.6-.2 1.9-.8 2.2-1.6.3-.8.3-1.5.2-1.6-.1-.1-.3-.2-.7-.4l-2-.9c-.3-.1-.6-.2-.8.2-.2.3-.9 1.1-1.1 1.3-.2.2-.4.2-.7 0-.4-.2-1.6-.6-3-1.9-1.1-1-1.9-2.2-2.1-2.6-.2-.4 0-.5.2-.7l.5-.6.3-.5c.1-.2 0-.4 0-.6l-.9-2.2c-.3-.6-.5-.6-.9-.6Z"/></svg> WhatsApp</a>`:'<button class="action wa" disabled>Sin WhatsApp</button>';return`<article class="stop-card ${isNext?'next':''} ${done?'done':''} ${expanded?'expanded':''}" id="stop-${id}"><button type="button" class="stop-toggle" onclick="toggleOrder('${id}')" aria-expanded="${expanded}" aria-controls="detail-${id}"><span class="stop-no">${n}</span><span class="customer"><small class="order-id">${esc(pedidoLabel(r.id))}</small><strong>${esc(r.cliente)}</strong><span>${icon('pin')} ${esc(r.ciudad||'Sin ciudad')}</span>${isNext||expanded?`<span>${icon('phone')} ${esc(r.contacto||'Sin teléfono')}</span>`:''}${!isNext&&!expanded?`<span class="compact-product">${icon('bag')} ${esc(r.detalle||'Sin detalle')}</span><b class="payment-chip ${paid?'paid':'collect'}">${esc(amount)}</b>`:''}</span><span class="chevron" aria-hidden="true"><svg class="delivery-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></button>${isNext&&!expanded?`<div class="featured-peek"><div class="peek-row">${icon('bag')} <strong>${esc(r.detalle||'Sin detalle')}</strong></div><div class="peek-row">${icon('money')} <b class="payment-chip ${paid?'paid':'collect'}">${esc(amount)}</b></div></div><div class="primary-actions">${maps}${wa}</div>`:''}<div class="order-details" id="detail-${id}" ${expanded?'':'hidden'}><div class="detail-facts"><div>${icon('bag')} <strong>${esc(r.detalle||'Sin detalle')}</strong></div><div>${icon('money')} <b class="payment-chip ${paid?'paid':'collect'}">${esc(amount)}</b></div><div>${icon('calendar')} <span>${esc(fechaBonita(r.dia_entrega||r.fecha))}</span></div></div>${r.observaciones?`<p class="delivery-note">${esc(r.observaciones)}</p>`:''}${r.delivery_observacion?`<p class="delivery-note">${esc(r.delivery_observacion)}</p>`:''}<div class="delivery-controls" id="controls-${id}"></div><div class="quick-row">${tel?`<a class="action" href="tel:+${tel}">${icon('phone')} Llamar</a>`:'<button class="action" disabled>Sin teléfono</button>'}<button class="action" onclick="abrirGestion('${id}','')">${icon('note')} Agregar nota</button></div><div class="primary-actions">${maps}${wa}</div>${done?'':`<button class="action complete-action" onclick="actualizar('${id}','Entregado')">${icon('check')} Marcar como entregado</button>`}<div class="fields" id="nota-${id}"><textarea id="obs-${id}" rows="3" maxlength="1000" placeholder="Nota del recorrido">${esc(r.delivery_observacion||'')}</textarea><label>Reprogramar para</label><input id="fecha-${id}" type="date"><button class="action save" onclick="guardarNota('${id}')">Guardar cambios</button></div></div></article>`}

const ESTADOS_ENVIO=['Pendiente','Entregado a transportadora','En camino','Entregado','Reprogramado','Cliente no responde','Cliente ausente','Cancelado'];
function mejorarEstados(list){list.forEach(r=>{const box=document.getElementById('controls-'+r.id);if(!box)return;const actual=r.estado_entrega==='Asignado'?'Pendiente':(r.estado_entrega||'Pendiente'),id=esc(r.id),main=['Pendiente','En camino','Entregado'];box.innerHTML=`<label>Estado de la entrega</label><div class="state-segments">${main.map(x=>`<button type="button" class="${x===actual?'active':''}" onclick="seleccionarEstado('${id}','${x}')" ${x===actual?'aria-pressed="true"':'aria-pressed="false"'}>${x}</button>`).join('')}</div><label class="more-label">Otros estados</label><select aria-label="Otros estados de entrega" onchange="seleccionarEstado('${id}',this.value);this.value=''"><option value="">Seleccionar si hace falta…</option>${ESTADOS_ENVIO.filter(x=>!main.includes(x)).map(x=>`<option value="${esc(x)}" ${x===actual?'selected':''}>${esc(x)}</option>`).join('')}</select>${r.delivery_actualizado_en?`<div class="updated-at">Última actualización: ${esc(new Date(r.delivery_actualizado_en).toLocaleString('es-PY',{dateStyle:'short',timeStyle:'short'}))}</div>`:''}`})}

function abrirGestion(id,estado){const box=document.getElementById('nota-'+id),fecha=document.getElementById('fecha-'+id),label=fecha?.previousElementSibling,save=box?.querySelector('.save');if(!box)return;box.dataset.estado=estado||'';box.classList.add('open');const reprograma=estado==='Reprogramado';if(fecha)fecha.style.display=reprograma?'block':'none';if(label)label.style.display=reprograma?'block':'none';if(save)save.textContent=estado?`Guardar: ${estado}`:'Guardar nota';box.scrollIntoView({behavior:'smooth',block:'center'})}
function seleccionarEstado(id,estado){if(['Reprogramado','Cliente no responde','Cliente ausente','Cancelado'].includes(estado)){abrirGestion(id,estado);toast(estado==='Reprogramado'?'Elegí una fecha y escribí el motivo':'Este estado requiere una observación');return}actualizar(id,estado)}
function toggleNota(id){document.getElementById('nota-'+id).classList.toggle('open')}
function abrirSiguiente(){const r=rows.find(x=>!['Entregado','Cancelado'].includes(x.estado_entrega)&&mapaLink(x.ubicacion));if(r)window.open(mapaLink(r.ubicacion),'_blank','noopener')}
async function actualizar(id,estado,obs='',fecha=null){if(estado==='Entregado'&&!confirm('¿Confirmás que el pedido fue entregado?'))return;if(estado==='Cancelado'&&!confirm('¿Confirmás que querés cancelar esta entrega?'))return;const{error}=await sb.rpc('delivery_actualizar',{p_token:token,p_venta_id:id,p_estado:estado,p_observacion:obs,p_nueva_fecha:fecha||null});if(error){toast(error.message);return}toast(estado==='Entregado'?'Entrega completada':'Estado actualizado: '+estado);await cargar()}
async function guardarNota(id){const box=document.getElementById('nota-'+id),obs=document.getElementById('obs-'+id).value.trim(),fecha=document.getElementById('fecha-'+id).value,estado=box.dataset.estado||rows.find(x=>String(x.id)===String(id))?.estado_entrega||'Pendiente';if(!obs){toast('Escribí una observación');return}if(estado==='Reprogramado'&&!fecha){toast('Elegí la nueva fecha');return}await actualizar(id,estado,obs,estado==='Reprogramado'?fecha:null)}
cargar();
</script></body></html>
