<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#444417"><title>Mis entregas · Ritual Ancestral</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--olive:#444417;--gold:#c58c49;--bg:#faf8f4;--border:#e8dfcf;--ok:#2e7d32;--warn:#e65100;--err:#c62828}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1a1a1a}.top{position:sticky;top:0;z-index:3;background:var(--olive);color:#fff;padding:16px 18px;box-shadow:0 3px 14px #0002}.top h1{font-size:18px;margin:0}.top small{color:#e1caa1}.wrap{max-width:720px;margin:auto;padding:16px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tools button,.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:650;cursor:pointer}.tools button{background:#fff;border:1px solid var(--border)}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 4px 16px #2b220c0b}.head{display:flex;justify-content:space-between;gap:10px}.name{font-size:17px;font-weight:750}.badge{padding:4px 9px;border-radius:999px;background:#fff3e0;color:var(--warn);font-size:11px;font-weight:700;white-space:nowrap}.meta{color:#666;margin:7px 0}.detail{background:#faf8f4;border-radius:10px;padding:10px;margin:10px 0}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.btn{background:#f4eee3;color:#533}.btn.primary{background:var(--olive);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.wa{background:#25d366;color:#fff}.fields{display:grid;gap:8px;margin-top:10px}input,textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px;font:inherit}.save{width:100%;margin-top:9px;background:var(--gold);color:#fff}.empty{text-align:center;padding:50px 15px;color:#888}.msg{padding:11px;border-radius:10px;margin-bottom:12px;background:#fff3e0;color:#8a4b00}.okmsg{background:#e8f5e9;color:var(--ok)}@media(max-width:520px){.actions{grid-template-columns:1fr 1fr}.name{font-size:16px}}
</style></head><body>
<div class="top"><h1>Ritual Ancestral · Entregas</h1><small id="who">Portal privado</small></div>
<main class="wrap"><div class="tools"><button onclick="filtrar('hoy')">Hoy</button><button onclick="filtrar('pendientes')">Pendientes</button><button onclick="filtrar('todas')">Todas</button><button onclick="cargar()">↻ Actualizar</button></div><div id="msg"></div><div id="list"><div class="empty">Cargando entregas…</div></div></main>
<script>
const SB_URL='https://nadxjmlbtvrdvigqynzx.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hZHhqbWxidHZyZHZpZ3F5bnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzOTczMjgsImV4cCI6MjA5Nzk3MzMyOH0.wEmd5Q0XjlCpO2SKd-GwBAO46fS1tGFFKg1ue8-LXAo';
const sb=supabase.createClient(SB_URL,SB_KEY),token=new URLSearchParams(location.search).get('token');let rows=[],filtro='hoy';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);const gs=n=>'Gs '+(parseInt(n)||0).toLocaleString('es-PY');
function mensaje(t,ok=false){document.querySelector('#msg').innerHTML='<div class="msg '+(ok?'okmsg':'')+'">'+esc(t)+'</div>';setTimeout(()=>document.querySelector('#msg').innerHTML='',3500)}
async function cargar(){if(!token){document.querySelector('#list').innerHTML='<div class="empty">Este enlace no contiene un acceso válido.</div>';return}document.querySelector('#list').innerHTML='<div class="empty">Actualizando…</div>';const {data,error}=await sb.rpc('delivery_listar',{p_token:token});if(error){document.querySelector('#list').innerHTML='<div class="empty">Enlace inválido o vencido.<br><small>Pedí un enlace nuevo a Ritual Ancestral.</small></div>';return}rows=data||[];if(rows[0])document.querySelector('#who').textContent=rows[0].delivery_persona;render()}
function filtrar(f){filtro=f;render()}
function render(){let list=rows;if(filtro==='hoy')list=list.filter(x=>(x.dia_entrega||x.fecha)===hoy());if(filtro==='pendientes')list=list.filter(x=>!['Entregado','Cancelado'].includes(x.estado_entrega));const el=document.querySelector('#list');if(!list.length){el.innerHTML='<div class="empty">No hay entregas en esta vista.</div>';return}el.innerHTML=list.map(r=>`<article class="card"><div class="head"><div><div class="name">${esc(r.cliente)}</div><div class="meta">${esc(r.ciudad||'Sin ciudad')} · ${esc(r.contacto||'Sin teléfono')}</div></div><span class="badge">${esc(r.estado_entrega||'Asignado')}</span></div><div class="detail"><strong>${esc(r.detalle||'')}</strong><br><small>${esc(r.observaciones||'Sin observaciones')}</small></div><div class="meta"><strong>A cobrar:</strong> ${esc(r.estado_pago||'')} · ${gs((r.total_productos||0)+(r.costo_delivery||0))}<br><strong>Entrega:</strong> ${esc(r.dia_entrega||r.fecha||'Sin fecha')}</div><div class="actions">${r.ubicacion?`<button class="btn primary" onclick="window.open('${esc(r.ubicacion)}','_blank')">📍 Ubicación</button>`:''}${r.contacto?`<button class="btn wa" onclick="window.open('https://wa.me/${String(r.contacto).replace(/\D/g,'').replace(/^0/,'595')}','_blank')">WhatsApp</button>`:''}<button class="btn" onclick="actualizar('${esc(r.id)}','En camino')">En camino</button><button class="btn ok" onclick="actualizar('${esc(r.id)}','Entregado')">Entregado</button><button class="btn" onclick="toggleNota('${esc(r.id)}')">Observación</button></div><div class="fields" id="nota-${esc(r.id)}" style="display:none"><textarea id="obs-${esc(r.id)}" rows="2" placeholder="Ej: cliente pidió entrega mañana">${esc(r.delivery_observacion||'')}</textarea><label>Nueva fecha (opcional)</label><input id="fecha-${esc(r.id)}" type="date"><button class="btn save" onclick="guardarNota('${esc(r.id)}')">Guardar observación / reprogramar</button></div></article>`).join('')}
function toggleNota(id){const e=document.getElementById('nota-'+id);e.style.display=e.style.display==='none'?'grid':'none'}
async function actualizar(id,estado,obs='',fecha=null){if(estado==='Entregado'&&!confirm('¿Confirmás que el pedido fue entregado?'))return;const {error}=await sb.rpc('delivery_actualizar',{p_token:token,p_venta_id:id,p_estado:estado,p_observacion:obs,p_nueva_fecha:fecha||null});if(error){mensaje(error.message);return}mensaje('Entrega actualizada: '+estado,true);await cargar()}
async function guardarNota(id){const obs=document.getElementById('obs-'+id).value.trim(),fecha=document.getElementById('fecha-'+id).value;const estado=fecha?'Reprogramado':'Asignado';if(!obs&&!fecha){mensaje('Escribí una observación o elegí una fecha');return}await actualizar(id,estado,obs,fecha||null)}
cargar();
</script></body></html>
